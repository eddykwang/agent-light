name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-unsigned:
    name: macOS unsigned build
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build unsigned release zip
        run: bash script/package_release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Agent-Light-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Agent-Light-*.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
