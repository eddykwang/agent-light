name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing draft release tag to verify (for example v0.1.6)"
        required: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          swift test
          python3 -m unittest discover -s Tests/ReleaseScriptsTests -v

  verify-signed-release:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    # GitHub requires push access to read draft release assets.
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      APPLE_TEAM_ID: P4P956A63K
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify locally signed draft release
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          archive="Agent-Light-$RELEASE_VERSION-macOS.zip"
          gh release download "$RELEASE_VERSION" --pattern "$archive" --dir "$RUNNER_TEMP/release"
          ditto -x -k "$RUNNER_TEMP/release/$archive" "$RUNNER_TEMP/verify"
          app="$RUNNER_TEMP/verify/Agent Light.app"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")"
          [[ "$actual_version" == "${RELEASE_VERSION#v}" ]]
          bash script/verify_release.sh "$app"
          shasum -a 256 "$RUNNER_TEMP/release/$archive"
